name: Preserve Sprint 1 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/sprint-1-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sprint-1-release
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Tag and describe the Sprint 1 deliverable
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const target = 'f38e300936f2f6f5d7aea3be20fd7f128202306d';
            const tag = 'v1';
            let ref;
            try {
              ref = (await github.rest.git.getRef({ owner, repo, ref: 'tags/' + tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref) {
              let sha = ref.object.sha;
              if (ref.object.type === 'tag') {
                sha = (await github.rest.git.getTag({ owner, repo, tag_sha: sha })).data.object.sha;
              }
              if (sha !== target) throw new Error('v1 already points elsewhere; refusing to move it.');
            } else {
              const annotated = await github.rest.git.createTag({
                owner, repo, tag, object: target, type: 'commit',
                message: 'Sprint 1 delivered prototype. Preserve this snapshot as the baseline for future sprints.'
              });
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/tags/' + tag, sha: annotated.data.sha
              });
            }
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: target,
                name: 'v1 - Sprint 1 deliverable',
                body: 'Sprint 1 delivered interactive prototype: My Profile (US2/US7), Job Search (US6), Job Posting (US14), and Candidate Matches (US4, with a US9 preview). Includes the searchable Training Coordinator example and skills above the job search form. Uses fictional data and browser-local interactions. Suggestions and matching evidence are simulated.\n\nPreserved source commit: ' + target + '\n\nRecovery: restore the application files from this tag through a new commit on main, then let GitHub Pages redeploy. Keep v1 fixed; use new tags for later sprint deliveries.',
                draft: false, prerelease: false
              });
            }
